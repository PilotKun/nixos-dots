################################################################################
# HYPRLAND KEYBINDINGS CONFIGURATION
# 
# This file handles all keyboard shortcuts for system controls, window 
# management, workspaces, and media. 
################################################################################

# ==============================================================================
# 1. MODIFIERS & VARIABLES
# ==============================================================================
# Set "Windows" key as the main modifier for most shortcuts
$mainMod = SUPER 

# Define your default applications here so they can be easily changed later
$terminal = alacritty
$browser = brave
$fileManager = nautilus
$editor = nvim
$menu = rofi -show drun

# ==============================================================================
# 2. CORE APPLICATIONS & SYSTEM
# ==============================================================================
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, B, exec, $browser
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod SHIFT, N, exec, $editor
bind = $mainMod, space, exec, $menu

# ==============================================================================
# 3. CLIPBOARD & SCREENSHOTS (Native Wayland Setup)
# ==============================================================================
# Make sure 'cliphist', 'wl-clipboard', 'grim', and 'slurp' are installed.
# These exec-once lines start the clipboard daemon when Hyprland launches.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# SUPER + CTRL + V: Open clipboard history in Rofi
bind = $mainMod CTRL, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Print (PrtScn): Capture selected area and copy to clipboard
bind = , Print, exec, grim -g "$(slurp)" - |satty -f - --copy-command wl-copy -o "$HOME/Pictures/Screenshots/%Y%m%d_%H%M%S.png"
# SUPER + Print: Capture entire screen and copy to clipboard
bind = $mainMod, Print, exec, grim - |satty -f - --copy-command wl-copy -o "$HOME/Pictures/Screenshots/%Y%m%d_%H%M%S.png"

# ==============================================================================
# 4. WINDOW MANAGEMENT
# ==============================================================================
bind = $mainMod, W, killactive,             # Close the currently focused window
bind = $mainMod, Q, exit,                   # Exit Hyprland (Logs you out)
bind = $mainMod, J, togglesplit,            # Toggle between horizontal/vertical split (dwindle)
bind = $mainMod, P, pseudo,                 # Pseudo-tiling (keeps window at its floating size but tiled)
bind = $mainMod, T, togglefloating,         # Toggle floating mode for the active window
bind = $mainMod, F, fullscreen, 0           # True fullscreen (hides waybar/gaps)
bind = $mainMod ALT, F, fullscreen, 1       # Maximize window (keeps waybar and gaps visible)

# --- Focus Navigation ---
# Use SUPER + Arrow Keys to move focus between windows
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Window Swapping ---
# Use SUPER + SHIFT + Arrow Keys to physically move windows around the screen
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# --- Window Cycling ---
bind = ALT, Tab, cyclenext,                 # Cycle forward through windows
bind = ALT SHIFT, Tab, cyclenext, prev      # Cycle backward through windows

# --- Mouse Bindings ---
# Hold SUPER and Left-Click to drag windows
bindm = $mainMod, mouse:272, movewindow
# Hold SUPER and Right-Click to resize windows
bindm = $mainMod, mouse:273, resizewindow

# ==============================================================================
# 5. WORKSPACES
# ==============================================================================
# Switch to workspace 1-10 using SUPER + [number]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace using SUPER + SHIFT + [number]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Navigate workspaces with SUPER + Tab or Scroll Wheel
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move the entire current workspace to a different monitor
bind = $mainMod SHIFT ALT, left, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT ALT, right, movecurrentworkspacetomonitor, r
bind = $mainMod SHIFT ALT, up, movecurrentworkspacetomonitor, u
bind = $mainMod SHIFT ALT, down, movecurrentworkspacetomonitor, d

# ==============================================================================
# 6. SCRATCHPAD & GROUPS (Tabbing)
# ==============================================================================
# Scratchpad is a hidden workspace you can toggle over your current screen
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# Groups allow you to stack multiple windows together like browser tabs
bind = $mainMod, G, togglegroup
bind = $mainMod ALT, left, moveintogroup, l
bind = $mainMod ALT, right, moveintogroup, r
bind = $mainMod ALT, up, moveintogroup, u
bind = $mainMod ALT, down, moveintogroup, d
bind = $mainMod ALT, Tab, changegroupactive, f     # Next tab in group
bind = $mainMod ALT SHIFT, Tab, changegroupactive, b # Previous tab in group

# ==============================================================================
# 7. MEDIA & HARDWARE CONTROLS (Audio & Brightness)
# ==============================================================================
# bindel = repeats when key is held, bindl = works even when screen is locked
# Requires: wpctl (WirePlumber), brightnessctl, playerctl

# Volume Controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness Controls
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media Player Controls (Play/Pause/Skip)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
